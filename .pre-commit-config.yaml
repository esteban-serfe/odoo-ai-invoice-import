# Only the modules written in this repo are linted. The vendored odoo-llm modules
# are excluded so they stay diffable against upstream (see UPSTREAM.md).
exclude: ^(serfe_llm|serfe_llm_thread|serfe_llm_tool|serfe_llm_assistant|serfe_llm_litellm|serfe_llm_training|serfe_web_json_editor|serfe_account_invoice_import_llm)/
repos:
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
  - repo: https://github.com/OCA/pylint-odoo
    rev: v9.1.3
    hooks:
      - id: pylint_odoo
        args: [--rcfile=.pylintrc]
